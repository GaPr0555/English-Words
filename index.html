const EX={};EXR.split("\n").forEach(l=>{const i=l.indexOf("|");EX[l.slice(0,i)]=l.slice(i+1)});
const W=RAW.trim().split("\n").map(l=>{const i=l.indexOf("=");return{es:l.slice(0,i).trim(),en:l.slice(i+1).split("/").map(s=>s.trim())}}).filter(w=>w.es&&w.en[0]);
const NEED=2,KEY="practica-ingles-v1";
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim();
const $=id=>document.getElementById(id);
let left={};
try{left=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
W.forEach(w=>{if(!(w.es in left))left[w.es]=NEED});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(left))}catch(e){}};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let q=[],cur=null,fb=false,lastOk=false,streak=0,GOAL=10,AC;
function beep(ok){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;(ok?[[660,0],[880,.12]]:[[220,0],[165,.16]]).forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?"sine":"sawtooth";o.frequency.value=f;g.gain.setValueAtTime(.15,t+d);g.gain.exponentialRampToValueAtTime(.001,t+d+.2);o.connect(g);g.connect(AC.destination);o.start(t+d);o.stop(t+d+.22)})}catch(e){}}
function build(){q=shuffle(W.filter(w=>left[w.es]>0))}
function stats(){$("cnt").textContent="Racha: "+streak;$("bar").firstElementChild.style.width=Math.min(100,100*streak/GOAL)+"%"}
function show(){
  fb=false;const c=$("card");c.className="";$("in").value="";$("in").disabled=false;
  $("go").textContent="COMPROBAR";$("go").disabled=true;stats();
  if(!q.length){cur=null;c.textContent="¡Lista completada!";$("in").disabled=true;return}
  cur=q[0];c.textContent=cur.es;$("in").focus();
}
function check(){
  if(fb){q.shift();if(left[cur.es]>0)place(cur,lastOk?40:10,lastOk?20:6);show();return}
  const a=norm($("in").value);if(!a)return;
  const ok=cur.en.some(x=>norm(x)===a),c=$("card");
  lastOk=ok;streak=ok?streak+1:0;beep(ok);
  if(ok){left[cur.es]--;c.className="ok";c.textContent=cur.en[0];if(EX[cur.es]){const s=document.createElement("small");s.textContent=EX[cur.es];c.append(s)}}
  else{c.className="no";c.innerHTML="";c.append(cur.en[0]);const s=document.createElement("small");s.textContent="Tu respuesta: "+$("in").value.trim()+". Volverá a salir.";c.append(s)}
  save();stats();fb=true;$("in").disabled=true;$("go").disabled=false;$("go").textContent="SIGUIENTE";$("go").focus();
}
function place(w,min,sp){q.splice(Math.min(q.length,min+Math.floor(Math.random()*sp)),0,w)}
$("in").addEventListener("input",()=>{$("go").disabled=!$("in").value.trim()});
$("in").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();check()}});
$("go").addEventListener("click",check);
build();show();
